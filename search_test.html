<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: #1e3a8a;
        }
        .search-container {
            margin: 20px 0;
        }
        #searchInput {
            padding: 8px;
            width: 300px;
            font-size: 16px;
        }
        #searchButton {
            padding: 8px 16px;
            background-color: #1e3a8a;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        #result {
            border: 1px solid #ddd;
            padding: 20px;
            margin-top: 20px;
            border-radius: 4px;
        }
        .course-item, .professor-item {
            padding: 10px;
            margin: 5px 0;
            background-color: #f9f9f9;
            border-radius: 4px;
        }
        pre {
            background-color: #f0f0f0;
            padding: 10px;
            overflow: auto;
        }
        details {
            margin-top: 20px;
        }
        summary {
            cursor: pointer;
            color: #1e3a8a;
        }
    </style>
</head>
<body>
    <h1>Search Test</h1>
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Enter search term...">
        <button id="searchButton">Search</button>
    </div>
    <div id="result">
        <p>Enter a search term and click "Search" to test the search functionality.</p>
        <p>Try these terms:</p>
        <ul>
            <li>Introduction</li>
            <li>Economics</li>
            <li>Tanaka</li>
            <li>CS301</li>
        </ul>
    </div>

    <script>
        // Function to fetch search results
        function fetchSearchResults(query) {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>Searching for: ' + query + '</p>';
            
            fetch(`search.php?query=${encodeURIComponent(query)}&t=${Date.now()}`)
                .then(response => {
                    console.log('Status:', response.status);
                    return response.text();
                })
                .then(text => {
                    console.log('Raw response:', text);
                    
                    try {
                        const data = JSON.parse(text);
                        console.log('Parsed data:', data);
                        
                        let html = `<h3>Results for "${query}":</h3>`;
                        
                        // Professors
                        html += `<h4>Professors (${data.professors ? data.professors.length : 0}):</h4>`;
                        if (data.professors && data.professors.length > 0) {
                            data.professors.forEach(prof => {
                                html += `<div class="professor-item">
                                    <h4>${prof.name}</h4>
                                    <p>${prof.department || 'Department not specified'}</p>
                                    <p><small>Rating: ${prof.avg_rating || 'No ratings yet'} (${prof.rating_count} ratings)</small></p>
                                </div>`;
                            });
                        } else {
                            html += '<p>No professors found</p>';
                        }
                        
                        // Courses
                        html += `<h4>Courses (${data.courses ? data.courses.length : 0}):</h4>`;
                        if (data.courses && data.courses.length > 0) {
                            data.courses.forEach(course => {
                                html += `<div class="course-item">
                                    <h4>${course.name} (${course.course_code || 'No code'})</h4>
                                    <p>Taught by: ${course.professor_name}</p>
                                    <p>${course.description || 'No description available'}</p>
                                    <p><small>Rating: ${course.avg_rating || 'No ratings yet'} (${course.rating_count} ratings)</small></p>
                                </div>`;
                            });
                        } else {
                            html += '<p>No courses found</p>';
                        }
                        
                        // Raw data
                        html += '<details><summary>Raw JSON Response</summary><pre>' + 
                                JSON.stringify(data, null, 2) + '</pre></details>';
                        
                        resultDiv.innerHTML = html;
                    } catch (e) {
                        resultDiv.innerHTML = `
                            <h3>Error parsing response</h3>
                            <p>${e.message}</p>
                            <pre>${text}</pre>
                        `;
                    }
                })
                .catch(error => {
                    resultDiv.innerHTML = `<h3>Fetch Error</h3><p>${error.message}</p>`;
                    console.error('Fetch error:', error);
                });
        }

        // Add event listeners
        document.getElementById('searchButton').addEventListener('click', () => {
            const query = document.getElementById('searchInput').value.trim();
            if (query) {
                fetchSearchResults(query);
            }
        });

        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('searchButton').click();
            }
        });

        // Set a default search term
        document.getElementById('searchInput').value = 'Introduction';
    </script>
</body>
</html>
